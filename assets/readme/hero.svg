<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Douban Quark Crawler (豆瓣夸克资源自动搜刮器)</title>
  <desc id="desc">这是一个全自动化的 Python 工具，用于批量查找用户豆瓣“想看”列表中的电影/剧集资源，并将搜索结果保存为本地 JSON 文件。当前实现不登录夸克网盘，也不执行自动转存。</desc>
